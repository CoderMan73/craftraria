# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5

# Fabric Loom, mirroring the version Rinku 3.0.4-26.2 itself builds with (MCSourceCode/Rinku,
# branch 26.2.0: fabric_loom_version=1.15.5). Proven to exist on maven.fabricmc.net.
loom_version=1.15.5

# Mod Properties
maven_group=com.craftraria
archives_base_name=craftraria
version=0.1.0+26.2

# Dependencies
# Fabric API 0.161.0+26.2 is the line craftlatro 0.9.0 shipped on for this exact stack.
fabric_api_version=0.161.0+26.2

# Cloth Config (26.2 line, LGPLv3) backs the settings screen; hard dependency.
cloth_config_version=26.2.155

# Mod Menu is only used to offer the settings screen as its config button; the mod loads without it.
modmenu_version=20.0.3

# Rinku: the embedded Chromium browser. 3.0.4-26.2 is the newest artifact actually published to
# https://keksuccino.github.io/maven/ (3.0.5-26.2 404s there despite the source tree declaring it)
# and the exact version craftlatro shipped, so its API surface is proven for the ported classes.
# Evidence: ai-docs/notes/2026-10-14-rinku-toolchain-probe.md
rinku_version=3.0.4-26.2
